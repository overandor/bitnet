[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitnet"
version = "0.1.0"
description = "Self-proving folders. Continuous cryptographic provenance for your filesystem."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "BitNet Contributors"}
]
keywords = [
    "provenance", "merkle", "filesystem", "integrity", "hash", "solana", "cryptographic"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "aiosqlite>=0.19",
    "aiohttp>=3.8",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
solana = ["solana>=0.30"]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "httpx>=0.24"]

[project.scripts]
bitnet = "bitnet.cli:main"

[project.urls]
Homepage = "https://github.com/bitnet/bitnet"
Documentation = "https://github.com/bitnet/bitnet#readme"
Issues = "https://github.com/bitnet/bitnet/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["bitnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
